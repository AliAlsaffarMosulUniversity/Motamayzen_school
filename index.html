<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ثانوية نينوى للمتميزين – الحضور وكشف الدرجات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F9F9; --soft:#EDF2F2; --surface:#FEFFFF; --ink:#2B3A3F; --muted:#63757B; --line:#DCE5E6;
  --sky:#33707F; --sky-soft:#E1EEF0; --green:#2E7D4F; --green-soft:#E3F1E8;
  --red:#B5474C; --red-soft:#F8E6E6; --amber:#8F6A1E; --amber-soft:#F6EDD8; --slate-soft:#E8EEEF;
  --banner:#3A7483; --banner-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1F21; --soft:#242B2E; --surface:#20272A; --ink:#DDE5E6; --muted:#98A8AC; --line:#344044;
    --sky:#8CC3CF; --sky-soft:#23393F; --green:#7CC79A; --green-soft:#24392D;
    --red:#E08A8E; --red-soft:#462A2C; --amber:#D9B878; --amber-soft:#3D331F; --slate-soft:#2A3336;
    --banner:#27505B; --banner-ink:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1F21; --soft:#242B2E; --surface:#20272A; --ink:#DDE5E6; --muted:#98A8AC; --line:#344044;
    --sky:#8CC3CF; --sky-soft:#23393F; --green:#7CC79A; --green-soft:#24392D;
    --red:#E08A8E; --red-soft:#462A2C; --amber:#D9B878; --amber-soft:#3D331F; --slate-soft:#2A3336;
    --banner:#27505B; --banner-ink:#FFFFFF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

.top{background:var(--banner);color:var(--banner-ink)}
.top :focus-visible{outline-color:#fff}
.themebtn{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:99px;width:42px;height:42px;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.themebtn svg{box-shadow:none;border-radius:0}
.top-in{max-width:1080px;margin:0 auto;padding:18px 16px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top svg{flex:none;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.top h1{font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:1.75rem;line-height:1.2;margin:0;font-weight:700}
.top p{margin:2px 0 0;color:rgba(255,255,255,.85);font-size:.9rem}
.top .grow{flex:1;min-width:200px}
.addr{display:inline-flex;align-items:center;gap:7px;margin-top:8px;padding:4px 14px 4px 12px;border-radius:99px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:.88rem;text-decoration:none;line-height:1.6}
.addr svg{box-shadow:none;border-radius:0;flex:none;opacity:.9}
.addr b{display:none;font-weight:600;border-inline-start:1px solid rgba(255,255,255,.4);padding-inline-start:9px;margin-inline-start:2px}
.addr[href] b{display:inline}
.addr[href]:hover{background:rgba(255,255,255,.26)}
#sync{font-size:.82rem;color:#fff;background:rgba(255,255,255,.16);border-radius:99px;padding:3px 12px}

#tabs{max-width:1080px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:10px 16px 0}
#tabs button{flex:none;border:0;background:none;padding:9px 14px;border-bottom:3px solid transparent;color:rgba(255,255,255,.78);font-weight:500;cursor:pointer;white-space:nowrap}
#tabs button[aria-current="page"]{color:#fff;border-bottom-color:#fff;font-weight:700}

#banner{max-width:1080px;margin:10px auto 0;padding:0 16px}
#banner div{background:var(--sky-soft);color:var(--sky);margin-bottom:6px;border-radius:8px;padding:8px 14px;font-size:.9rem}
main{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
h2{font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:1.3rem;margin:0 0 6px;font-weight:700}
h3{font-size:1.02rem;margin:26px 0 8px}
.lead{font-size:1.08rem;margin:0 0 16px;max-width:60ch}
.muted{color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:26px 18px;text-align:center}
.empty p{margin:0 0 14px}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 13px;cursor:pointer;border-inline-end:1px solid var(--line)}
.seg button:last-child{border-inline-end:0}
.seg button[aria-pressed="true"]{background:var(--sky);color:#fff;font-weight:600}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0E2228}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0E2228}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--sky);border-color:var(--sky);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0E2228}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0E2228}}
.btn.sm{padding:3px 9px;font-size:.82rem}
.btn.danger{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=date],input[type=number],input[type=url],input[type=time],input[type=password],input[type=tel],textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;max-width:100%}
textarea{width:100%;min-height:110px}
label.f{display:inline-flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:2px}

.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{font-size:.86rem;color:var(--muted);font-weight:600;background:var(--soft);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:center;font-variant-numeric:tabular-nums}
td.idx{color:var(--muted);width:2.2em;text-align:center;font-variant-numeric:tabular-nums}

/* دفتر الحضور */
.reg th.day{text-align:center;min-width:74px;padding:8px 4px}
.reg th.day b{display:block;color:var(--ink);font-size:.95rem}
.reg th.day small{display:block;font-weight:400}
.reg th.today{background:var(--sky-soft)}
.reg td.c{text-align:center;padding:5px 4px}
.cell{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--soft);cursor:pointer;font-weight:700;font-size:1rem;line-height:1}
.cell.P{background:var(--green-soft);border-color:transparent;color:var(--green)}
.cell.A{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.cell.L{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.cell.E{background:var(--slate-soft);border-color:var(--muted);color:var(--ink)}
.cell:disabled{opacity:.35;cursor:not-allowed}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--muted);margin:10px 2px}
.legend i{font-style:normal;font-weight:700;display:inline-block;width:1.6em;height:1.6em;line-height:1.6em;text-align:center;border-radius:6px;margin-inline-end:5px}
.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.84rem;font-weight:600}
.tag.ok{background:var(--green-soft);color:var(--green)} .tag.no{background:var(--amber-soft);color:var(--amber)} .tag.bad{background:var(--red-soft);color:var(--red)}

.marks input{width:4.4em;text-align:center;direction:ltr;padding:6px 4px}
.marks td.tot{font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.rowedit{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line)}
.rowedit:last-child{border-bottom:0}
.rowedit input[type=text]{flex:1;min-width:150px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:12px}
/* الترويسة: الغلاف والشعار */
.cover{background:#FCF6E6;border-bottom:3px solid #C9A24A;color:#22323A}
.cover :focus-visible{outline-color:#1F3F7A}
.cover-in{max-width:1080px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:flex-end;gap:16px}
.logo{flex:none;align-self:center;border:0;background:none;padding:0;cursor:zoom-in;border-radius:50%;margin-bottom:14px}
.logo img{display:block;width:104px;height:104px;border-radius:50%;box-shadow:0 3px 12px rgba(31,63,122,.28)}
.cover .grow{flex:1;min-width:0;align-self:center;padding-bottom:14px}
.cover h1{color:#1F3F7A}
.callig{display:block;height:58px;max-width:100%}
.cover p{margin:2px 0 0;color:#4A5A60;font-size:.95rem}
.kids{flex:none;height:168px;border:0;background:none;padding:0;cursor:zoom-in}
.kids img{height:100%;display:block}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.cover .addr{margin-top:0;background:#2F6877;border-color:#2F6877}
.cover .addr[href]:hover{background:#27505B}
.cover #sync{background:rgba(47,104,119,.13);color:#2B5B67}
.navrow{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:8px;padding-inline-end:16px}
.navrow #tabs{flex:1;min-width:0;margin:0}
.navrow .themebtn{flex:none;width:36px;height:36px}
#lightbox{position:fixed;inset:0;z-index:50;background:rgba(10,20,25,.84);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#lightbox[hidden]{display:none}
#lightbox img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
@media (max-width:640px){.logo img{width:68px;height:68px}.kids{height:104px}.callig{height:40px}.cover-in{gap:10px}.cover p{font-size:.82rem}}
@media (max-width:420px){.kids{display:none}}

/* المراقبات */
.pg th{text-align:center;white-space:nowrap}
.pg td.day{white-space:nowrap}.pg td.day b{display:block}.pg td.day small{color:var(--muted);font-variant-numeric:tabular-nums}
.pg td.c{padding:6px;text-align:center;vertical-align:middle;min-width:128px}
.pg td.c span{display:block;font-weight:600;line-height:1.5}
.pg td.c span.dup{color:var(--red)}.pg td.c span.none{color:var(--muted);font-weight:400}
.pg select{width:100%;margin:2px 0;padding:6px 4px}
.warn{background:var(--red-soft);color:var(--red);border-radius:8px;padding:8px 14px;margin:0 0 12px}

/* مراسلة أولياء الأمور */
.btn.wa{background:#1F8F4E;border-color:#1F8F4E;color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn.wa svg{flex:none}
.btn.wa.big{padding:11px 20px;font-size:1.05rem;font-weight:700}
.btn.wa.done{background:var(--surface);color:var(--green);border-color:var(--green)}
.ph{direction:ltr;text-align:left;width:150px;font-variant-numeric:tabular-nums}
#msgtext{min-height:190px;line-height:1.8}

/* شاشة القفل */
.lock{max-width:380px;margin:36px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;text-align:center}
.lock svg{color:var(--sky)}
.lock h2{margin:8px 0 4px}
.lock p{margin:0 0 16px;color:var(--muted)}
.lock input{width:100%;text-align:center;font-size:1.1rem;padding:10px;margin-bottom:12px}
.lock .btn{width:100%;padding:10px}

/* الجدول الأسبوعي */
.tt th.day{text-align:center;min-width:96px}
.tt th.day.today,.tt td.today{background:var(--sky-soft)}
.tt td.per{white-space:nowrap;width:1%}
.tt td.per b{display:block}.tt td.per small{color:var(--muted);direction:ltr;display:inline-block;font-variant-numeric:tabular-nums}
.tt td.c{padding:5px;text-align:center}
.tt tr.brk td{background:var(--soft);text-align:center;color:var(--muted);font-weight:600;padding:6px;letter-spacing:.02em}
.sub{display:block;border-radius:9px;padding:9px 6px;font-weight:600;font-size:.93rem;line-height:1.35;background:hsl(var(--h) 42% 90%);color:hsl(var(--h) 45% 25%)}
.sub.none{background:none;color:var(--muted);font-weight:400;border:1px dashed var(--line)}
:root[data-theme="dark"] .sub:not(.none){background:hsl(var(--h) 26% 25%);color:hsl(var(--h) 48% 84%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sub:not(.none){background:hsl(var(--h) 26% 25%);color:hsl(var(--h) 48% 84%)}}
.tt select{width:100%;min-width:90px;padding:7px 4px}
.counts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.counts .sub{display:inline-block;padding:4px 12px}
.printonly{display:none}
#toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:9}
#toast span{background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:99px;font-size:.92rem;opacity:0;transition:opacity .2s}
#toast span.on{opacity:1}
.paperwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  :root{padding:0} body{background:#fff}
  .top,#tabs,#banner,#toast,#lightbox,.noprint{display:none!important}
  .printonly{display:block}
  main{padding:0;max-width:none} .paperwrap{border:0;padding:0;overflow:visible}
}
</style>
<style id="sheetcss"></style>
</head>
<body>
<header class="top">
<div class="cover"><div class="cover-in">
  <span class="logo" style="cursor:default"><img data-img="logo" alt="شعار المدرسة" width="104" height="104"></span>
  <div class="grow"><h1 id="sname">ثانوية نينوى للمتميزين</h1><p>سجل الحضور والغياب وكشف الدرجات</p>
    <div class="meta"><a id="addr" class="addr"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.6A2.6 2.6 0 1 1 12 6.4a2.6 2.6 0 0 1 0 5.2z"/></svg><span id="addrtxt"></span><b id="addrgo">فتح الخريطة</b></a>
    <span id="sync" role="status">جارٍ التحميل…</span></div></div>
</div></div>
<div class="navrow"><nav id="tabs" aria-label="أقسام النظام"></nav><button class="themebtn" id="themebtn" data-act="theme"></button></div>
</header>
<div id="lightbox" data-act="coverclose" hidden></div>
<div id="banner"></div>
<main id="view"></main>
<div id="toast"><span></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* ---------- صور المدرسة ---------- */
const IMG={"logo":"data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%20120%22%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2260%22%20r%3D%2258%22%20fill%3D%22%232F6877%22/%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2260%22%20r%3D%2250%22%20fill%3D%22%23FCF6E6%22/%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2260%22%20r%3D%2250%22%20fill%3D%22none%22%20stroke%3D%22%23C9A24A%22%20stroke-width%3D%222.5%22/%3E%3Cpath%20d%3D%22M60%2022l4.6%209.6%2010.4%201.3-7.7%207.2%202%2010.4L60%2045.4l-9.3%205.1%202-10.4-7.7-7.2%2010.4-1.3z%22%20fill%3D%22%23C9A24A%22/%3E%3Cpath%20d%3D%22M60%2062c-8-6-19-7-30-5v30c11-2%2022-1%2030%205%208-6%2019-7%2030-5V57c-11-2-22-1-30%205z%22%20fill%3D%22%232F6877%22/%3E%3Cpath%20d%3D%22M60%2062v30%22%20stroke%3D%22%23FCF6E6%22%20stroke-width%3D%222.5%22/%3E%3Cpath%20d%3D%22M37%2066c6-.8%2012%200%2017%202.4M37%2074c6-.8%2012%200%2017%202.4M83%2066c-6-.8-12%200-17%202.4M83%2074c-6-.8-12%200-17%202.4%22%20stroke%3D%22%23FCF6E6%22%20stroke-width%3D%222%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E"};
document.querySelectorAll("[data-img]").forEach(i=>{i.src=IMG[i.dataset.img]});
/* ---------- ثوابت ---------- */
const MAX=[20,30], PARTS=['أعمال السنة','الدرجة المكتسبة'], TERM_MAX=50;
const ST={P:['✓','حاضر'],A:['غ','غائب']}, CYCLE=['P','A'];
const TABS=[['today','اليوم'],['att','الحضور والغياب'],['tt','الجدول الأسبوعي'],['proc','المراقبات'],['msg','مراسلة أولياء الأمور'],['marks','رصد الدرجات'],['rep','كشف الدرجات'],['set','الطلاب والإعدادات']];
const FONTS='https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Reem+Kufi:wght@700&display=swap';
const SHEET_CSS=`
.sheet{font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;color:#22323A;background:#fff;direction:rtl;font-size:14px;line-height:1.6;min-width:560px;max-width:900px;margin:0 auto;page-break-after:always;break-after:page}
.sheet:last-child{page-break-after:auto;break-after:auto}
.sheet.wide{max-width:none}
.sh-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:3px double #33707F;padding-bottom:10px;margin-bottom:12px}
.sh-brand{display:flex;align-items:center;gap:12px}
.sh-logo{width:68px;height:68px;flex:none}
.sh-school{font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:24px;display:block;line-height:1.3}
.sh-head span{color:#566A70;font-size:12.5px}
.sh-title{text-align:left;font-weight:700;font-size:17px}
.sh-title small{display:block;font-weight:400;color:#566A70;font-size:12.5px}
.sh-info{display:grid;grid-template-columns:1fr 1fr;gap:2px 24px;margin-bottom:12px}
.sh-info div{border-bottom:1px dotted #B4C4C8;padding:3px 0}
.sh-info b{color:#566A70;font-weight:600;margin-left:8px}
.sheet table{width:100%;border-collapse:collapse}
.sheet th,.sheet td{border:1px solid #B4C4C8;padding:5px 8px;text-align:center;background:none;color:#22323A;font-size:13.5px}
.sheet th{background:#E6F0F2;font-weight:700}
.sheet td.nm,.sheet th.nm{text-align:right;white-space:nowrap}
.sheet tfoot td{font-weight:700;background:#F4F8F9}
.sheet .low{color:#B3151D;font-weight:700}
.sh-sum{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.sh-sum div{flex:1;min-width:110px;border:1px solid #B4C4C8;border-radius:6px;padding:6px 10px;text-align:center}
.sh-sum b{display:block;font-size:17px}
.sh-sum span{color:#566A70;font-size:12px}
.sh-note{margin:10px 0;font-size:13px}
.sheet td.tc{padding:10px 6px;font-weight:600}
.sheet th small{display:block;font-weight:400;direction:ltr}
.sheet td.brk{background:#F4F8F9;color:#566A70;font-weight:700;width:34px;line-height:1.3}
.sh-sign{display:flex;justify-content:space-between;gap:20px;margin-top:38px}
.sh-sign div{flex:1;text-align:center;border-top:1px solid #22323A;padding-top:5px;font-size:13px}
.sh-sign b{display:block;margin-top:3px;font-size:14.5px;min-height:1.6em}
.sheet td.wd{font-size:12.5px}
`;
document.getElementById('sheetcss').textContent=SHEET_CSS;

/* ---------- أدوات ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const W1=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
const W10=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'],W100=['','مئة','مئتان','ثلاثمئة','أربعمئة','خمسمئة','ستمئة','سبعمئة','ثمانمئة','تسعمئة'];
function w999(n){const p=[],hd=Math.floor(n/100),r=n%100;if(hd)p.push(W100[hd]);if(r){if(r<20)p.push(W1[r]);else{const o=r%10,t=Math.floor(r/10);p.push(o?W1[o]+' و'+W10[t]:W10[t])}}return p.join(' و')}
function words(v){
  if(v==null)return'—';const x=Math.round(v*2)/2,i=Math.floor(x),half=x-i>0;let s='';
  if(i){const th=Math.floor(i/1000),r=i%1000,p=[];if(th)p.push(th===1?'ألف':th===2?'ألفان':w999(th)+(th<=10?' آلاف':' ألفاً'));if(r)p.push(w999(r));s=p.join(' و')}
  return half?(s?s+' ونصف':'نصف'):(s||'صفر');
}

const Store={
  db:null,pending:{},busy:{},
  async init(){
    let db=null,user=null;
    try{if(window.claude&&window.claude.use){[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}}catch(e){}
    this.db=db;S.local=!db;
    try{if(user&&(await user.can('data.write'))===false)S.canWrite=false}catch(e){}
  },
  async get(key){
    if(this.db){const s=await this.db.doc(key).get();return s.exists?clone(s.data()):null}
    try{const v=localStorage.getItem('ninawa:'+key);return v?JSON.parse(v):null}catch(e){return null}
  },
  set(key,obj){this.pending[key]=clone(obj);if(!this.busy[key])this.flush(key)},
  async flush(key){
    this.busy[key]=true;setSync('جارٍ الحفظ…');
    while(key in this.pending){
      const o=this.pending[key];delete this.pending[key];
      try{
        if(this.db)await this.db.doc(key).set(o);
        else localStorage.setItem('ninawa:'+key,JSON.stringify(o));
      }catch(e){this.fail(e)}
    }
    this.busy[key]=false;
    if(!Object.values(this.busy).some(Boolean))setSync();
  },
  fail(e){
    const c=e&&e.code;
    if(c==='invalid_argument'||c==='not_granted'||c==='revoked'){S.canWrite=false;drawBanner();toast('لم يُحفظ التعديل: صلاحيتك للعرض فقط')}
    else if(c==='quota_exceeded')toast('امتلأت مساحة التخزين. احذف بيانات قديمة ثم حاول');
    else toast('تعذّر الحفظ. تحقق من الاتصال وأعد المحاولة');
  },
  async put(key,o){if(this.db)await this.db.doc(key).set(o);else localStorage.setItem('ninawa:'+key,JSON.stringify(o))},
  async list(coll){
    if(this.db){const q=await this.db.collection(coll).limit(1000).get();return q.docs.map(d=>coll+'/'+d.id)}
    const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('ninawa:'+coll+'/'))out.push(k.slice(7))}}catch(e){}return out;
  },
  async del(key){
    try{if(this.db)await this.db.doc(key).delete();else localStorage.removeItem('ninawa:'+key)}catch(e){this.fail(e)}
  }
};
function setSync(t){$('#sync').textContent=t||(S.local?'✓ بياناتك محفوظة على هذا الجهاز':'✓ تم حفظ جميع البيانات')}

const attKey=(c,ym)=>`att/${c}_${ym}`, gKey=(c,t)=>`grades/${c}_t${t}`;
async function loadDoc(key,force){
  if(!force&&S.docs[key])return S.docs[key];
  const d=(await Store.get(key))||{};
  if(key.startsWith('att/')){if(!d.d||typeof d.d!=='object')d.d={};
    for(const day of Object.values(d.d))if(day)for(const [sid,st] of Object.entries(day)){if(st==='E')day[sid]='A';else if(st!=='A')delete day[sid]}
  }else if(key.startsWith('timetable/')){if(!d.g||typeof d.g!=='object')d.g={}}
  else{if(!d.m||typeof d.m!=='object')d.m={};
    for(const st of Object.values(d.m))if(st)for(const k of Object.keys(st)){const a=Array.isArray(st[k])?st[k]:[];st[k]=MAX.map((mx,j)=>a[j]==null?null:Math.min(mx,Math.max(0,Number(a[j])||0)))}
  }
  return S.docs[key]=d;
}
async function loadBase(){
  const [c,s]=await Promise.all([Store.get('school/config'),Store.get('school/students')]);
  const def=defaultCfg();
  S.cfg=c&&Array.isArray(c.classes)&&c.classes.length?Object.assign(def,c):def;
  if(!Array.isArray(S.cfg.subjects))S.cfg.subjects=defaultCfg().subjects;
  if(!Array.isArray(S.cfg.terms)||S.cfg.terms.length<2)S.cfg.terms=defaultCfg().terms;
  if(!Array.isArray(S.cfg.periods)||!S.cfg.periods.length)S.cfg.periods=defaultCfg().periods;
  if(!S.cfg.classes.some(x=>x.id==='c6'))S.cfg.classes.push({id:'c6',name:'الصف السادس العلمي',teacher:''});
  S.students=s&&Array.isArray(s.list)?s.list.filter(x=>x&&x.id):[];
  if(!S.cfg.classes.some(x=>x.id===S.classId))S.classId=S.cfg.classes[0].id;
}

function monthsBetween(a,b){const out=[];let d=parse(a.slice(0,7)+'-01');const e=parse(b);while(d<=e){out.push(iso(d).slice(0,7));d=new Date(d.getFullYear(),d.getMonth()+1,1)}return out}
async function termAtt(cid,ti){
  const T=S.cfg.terms[ti],per={};let taken=0;
  const docs=await Promise.all(monthsBetween(T.from,T.to).map(m=>loadDoc(attKey(cid,m))));
  for(const doc of docs)for(const [d,day] of Object.entries(doc.d)){
    if(d<T.from||d>T.to||!day)continue;taken++;
    for(const [sid,st] of Object.entries(day)){const p=per[sid]||(per[sid]={A:0,L:0,E:0});if(st in p)p[st]++}
  }
  return{taken,per};
}
function subjTotal(gdoc,sid,sub){let a=gdoc.m[sid]&&gdoc.m[sid][sub];if(!a)return null;a=a.slice(0,MAX.length);if(!a.some(v=>v!=null))return null;return a.reduce((x,v)=>x+(Number(v)||0),0)}
async function classResults(cid,termSel){
  const terms=termSel==='y'?[1,2]:[Number(termSel)],mx=termSel==='y'?TERM_MAX*2:TERM_MAX;
  const gd=await Promise.all(terms.map(t=>loadDoc(gKey(cid,t))));
  const rows=inClass(cid).map(st=>{
    const vals={},byTerm={};let sum=0,n=0,fail=false,partial=false;
    for(const sb of S.cfg.subjects){
      const ts=gd.map(g=>subjTotal(g,st.id,sb.id));byTerm[sb.id]=ts;
      const have=ts.filter(v=>v!=null);
      const v=have.length?have.reduce((a,b)=>a+b,0):null;
      if(have.length&&have.length<ts.length)partial=true;
      vals[sb.id]=v;if(v!=null){sum+=v;n++;if(v<mx/2)fail=true}
    }
    if(partial)fail=false;
    return{st,vals,byTerm,sum,n,avg:n?sum/(n*mx)*100:null,fail,partial,rank:null};
  });
  const ranked=rows.filter(r=>r.avg!=null).sort((a,b)=>b.avg-a.avg);
  ranked.forEach((r,i)=>{r.rank=i&&Math.abs(ranked[i-1].avg-r.avg)<1e-9?ranked[i-1].rank:i+1});
  return{rows,gd,terms,mx,count:ranked.length};
}

        :(si>=0?subChip(si):'<span class="sub none">—</span>');

const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس'],HUES=[200,150,35,275,340,95,18,245,175,310];
const ORD=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة'];
function periodLabels(){let n=0;return S.cfg.periods.map(p=>p.br?'الاستراحة':'الحصة '+(ORD[n++]||n))}
const tm=t=>{const [a,b]=String(t||'').split(':');return a?Number(a)+':'+(b||'00'):'—'};
const subIdx=id=>S.cfg.subjects.findIndex(s=>s.id===id);
const subChip=i=>`<span class="sub" style="--h:${HUES[i%HUES.length]}">${esc(S.cfg.subjects[i].name)}</span>`;
function sheetTT(c,doc){
  const P=S.cfg.periods,L=periodLabels();

function ttDoc(){const key=ttKey(S.classId);return[key,S.docs[key]||(S.docs[key]={g:{}})]}

/* خانات الحضور */
function dayOf(k){const doc=S.docs[attKey(S.classId,k.slice(0,7))];return doc?doc.d[k]:undefined}
function dayHead(k){

/* الكشوف */
async function attFor(cid,termSel){
  const ts=termSel==='y'?[0,1]:[Number(termSel)-1];const rs=await Promise.all(ts.map(t=>termAtt(cid,t)));
  const out={taken:0,per:{}};
  for(const r of rs){out.taken+=r.taken;for(const [sid,p] of Object.entries(r.per)){const o=out.per[sid]||(out.per[sid]={A:0,L:0,E:0});o.A+=p.A;o.L+=p.L;o.E+=p.E}}
  return out;
}
const termName=t=>t==='y'?'النتيجة النهائية (الفصلان معاً)':t==='1'?'الفصل الدراسي الأول':'الفصل الدراسي الثاني';
const sheetHead=title=>`<div class="sh-head"><div class="sh-brand"><img class="sh-logo" src="${IMG.logo}" alt=""><div><b class="sh-school">${esc(S.cfg.name)}</b><span>${esc(S.cfg.place)}</span></div></div><div class="sh-title">${title}<small>العام الدراسي ${esc(S.cfg.year)}</small></div></div>`;
const mk=(v,mx)=>v==null?'—':(v<mx/2?`<span class="low">${f1(v)}</span>`:f1(v));
const signs=(c,parent)=>`<div class="sh-sign"><div>مرشد الصف<b>${esc(c.teacher||'')}</b></div><div>مدير المدرسة<b>${esc(S.cfg.principal||'')}</b></div>${parent?'<div>ولي الأمر<b></b></div>':''}</div>`;
function sheetStudent(R,row,att){
  const c=cls(row.st.c),annual=S.repTerm==='y',g=R.gd[0],mx=R.mx;
  let thead,body;
  if(annual){
    thead=`<tr><th class="nm">المادة</th><th>الفصل الأول (${TERM_MAX})</th><th>الفصل الثاني (${TERM_MAX})</th><th>المجموع (${mx})</th><th>المجموع كتابةً</th><th>التقدير</th></tr>`;
    body=S.cfg.subjects.map(sb=>`<tr><td class="nm">${esc(sb.name)}</td><td>${f1(row.byTerm[sb.id][0])}</td><td>${f1(row.byTerm[sb.id][1])}</td><td>${mk(row.vals[sb.id],mx)}</td><td class="wd">${words(row.vals[sb.id])}</td><td>${gwm(row.vals[sb.id],mx)}</td></tr>`).join('');
  }else{
    thead=`<tr><th class="nm">المادة</th>${MAX.map((m,j)=>`<th>${PARTS[j]} (${m})</th>`).join('')}<th>المجموع (${mx})</th><th>المجموع كتابةً</th><th>التقدير</th></tr>`;
    body=S.cfg.subjects.map(sb=>{const a=(g.m[row.st.id]&&g.m[row.st.id][sb.id])||[];return`<tr><td class="nm">${esc(sb.name)}</td>${MAX.map((m,j)=>`<td>${f1(a[j]??null)}</td>`).join('')}<td>${mk(row.vals[sb.id],mx)}</td><td class="wd">${words(row.vals[sb.id])}</td><td>${gwm(row.vals[sb.id],mx)}</td></tr>`}).join('');

/* استيراد Excel */
const norm=s=>String(s??'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim().toLowerCase();
function matchClass(v){
  const t=norm(v);if(!t)return null;const C=S.cfg.classes;
  for(const c of C)if(norm(c.name)===t)return c.id;
  const dg=t.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).match(/\d+/);
  if(dg)return C[Number(dg[0])-1]?C[Number(dg[0])-1].id:null;
  const ord=['اول','ثاني','ثالث','رابع','خامس','سادس'];
  for(let i=0;i<ord.length;i++)if(t.includes(ord[i]))return C[i]?C[i].id:null;
  return null;
}
function parseRows(rows,file){
  let hr=-1,nc=-1,cc=-1,pc=-1;
  for(let r=0;r<Math.min(rows.length,6)&&hr<0;r++){
    const cells=(rows[r]||[]).map(norm);
    const i=cells.findIndex(x=>/اسم|name/.test(x)&&x.length<30);
    if(i>=0){hr=r;nc=i;cc=cells.findIndex((x,j)=>j!==i&&/صف|فصل|class|grade/.test(x));pc=cells.findIndex((x,j)=>j!==i&&j!==cc&&/هاتف|موبايل|جوال|واتس|phone|mobile/.test(x))}
  }
  if(hr<0){ // بلا عناوين: أول عمود فيه نص
    const w=Math.max(0,...rows.map(r=>r.length));
    for(let j=0;j<w&&nc<0;j++)if(rows.filter(r=>/[^\d\s.]/.test(String(r[j]??''))).length>=rows.length/2)nc=j;
  }
  const out={file,rows:[],dup:0,noClass:0,per:{}},seen=new Set(S.students.map(s=>s.c+'|'+norm(s.name)));
  if(nc<0)return out;
  for(let r=hr+1;r<rows.length;r++){
    const name=String(rows[r][nc]??'').trim().replace(/\s+/g,' ');
    if(!name||!/[^\d\s.]/.test(name))continue;
    let c=cc>=0?matchClass(rows[r][cc]):null;
    if(!c){c=S.classId;if(cc>=0&&norm(rows[r][cc]))out.noClass++}
    const k=c+'|'+norm(name);if(seen.has(k)){out.dup++;continue}seen.add(k);
    out.rows.push({name:name.slice(0,80),c,ph:pc>=0?cleanPh(rows[r][pc]):''});out.per[c]=(out.per[c]||0)+1;
  }
  return out;
}

async function saveFile(filename,data,mime){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename,data});toast('تم تنزيل الملف')}catch(e){if(!e||e.code!=='declined')toast('لم يُنزَّل الملف')}return}
  try{
    const url=URL.createObjectURL(new Blob([data],{type:mime||'application/octet-stream'}));
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);toast('تم تنزيل الملف');
  }catch(e){toast('لم يُنزَّل الملف')}
}

  let seed=20261007;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

  }

async function hashPw(pw,salt){
  const t=salt+'|'+pw;
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}
  return'f'+(a>>>0).toString(16)+(b>>>0).toString(16);
}

function prCounts(){const c={};for(const d of S.pg.days)for(const h of S.pg.halls)for(const id of cellOf(d,h))if(id&&prName(id))c[id]=(c[id]||0)+1;return c}
function prDayDup(d){const seen={},dup=new Set();for(const h of S.pg.halls)for(const id of cellOf(d,h))if(id&&prName(id)){if(seen[id])dup.add(id);seen[id]=1}return dup}

function procAuto(){
  const T=prOn(),P=S.pg,cnt={},last={};T.forEach(t=>{cnt[t.id]=0;last[t.id]=-9});P.g={};let short=0;
  P.days.forEach((d,di)=>{const used=new Set();
    P.halls.forEach((h,hi)=>{const a=[];
      for(let k=0;k<P.per;k++){
        const rot=t=>(T.indexOf(t)+di*3+hi)%T.length;
        const c=T.filter(t=>!used.has(t.id)).sort((x,y)=>cnt[x.id]-cnt[y.id]||last[x.id]-last[y.id]||rot(x)-rot(y))[0];
        if(!c){short++;a.push('');continue}
        used.add(c.id);cnt[c.id]++;last[c.id]=di;a.push(c.id)}
      P.g[d.id+'_'+h.id]=a})});
  return short;
}

    prAddNames([['أحمد يونس ذنون','الرياضيات'],['محمد سالم حسن','الفيزياء'],['عمر خالد محمود','الكيمياء'],['زيد طه ياسين','الأحياء'],['مصطفى غانم علي','اللغة العربية'],['حازم سعد إبراهيم','اللغة الإنجليزية'],['يوسف محمود عبد الله','التربية الإسلامية'],['علي حسن يوسف','الاجتماعيات'],['خالد إبراهيم سالم','الحاسوب'],['سعد عمر أحمد','الرياضيات'],['ياسين محمد زيد','الفيزياء'],['طه علي مصطفى','اللغة العربية'],['محمود يوسف حازم','الكيمياء'],['غانم أحمد خالد','اللغة الإنجليزية']].map(([name,sub])=>({name,sub})));
    toast('حُمّلت أسماء تجريبية');render()},
  dayadd(){if(!guard())return;const P=S.pg;let d=P.days.length?addDays(parse(P.days[P.days.length-1].date),1):new Date();
    while(d.getDay()>4)d=addDays(d,1);P.days.push({id:uid(),date:iso(d),note:''});savePg();render()},
  daydel(b){if(!guard())return;confirm2(b,()=>{S.pg.days=S.pg.days.filter(d=>d.id!==b.dataset.s);savePg();render()})},
  halladd(){if(!guard())return;S.pg.halls.push({id:uid(),name:'القاعة '+(S.pg.halls.length+1)});savePg();render()},
  halldel(b){if(!guard())return;confirm2(b,()=>{S.pg.halls=S.pg.halls.filter(x=>x.id!==b.dataset.s);savePg();render()})},
  prdl(){download(S.pg.title||'جدول المراقبات',sheetProc(),true)},
  prlistdl(){download('قائمة التدريسيين المشمولين بالمراقبة',sheetProcList(),false)}
});
Object.assign(CH,{
  prcell(e){if(!guard()){render();return}const a=(S.pg.g[e.dataset.k]||[]).slice();const i=Number(e.dataset.i);while(a.length<=i)a.push('');a[i]=e.value;S.pg.g[e.dataset.k]=a;savePg()},
  prname(e){if(!guard())return;const t=prFind(S.pr.list,e.dataset.s),n=e.value.trim();if(!t||!n){render();return}t.name=n.slice(0,80);savePr()},
  prsub(e){if(!guard())return;const t=prFind(S.pr.list,e.dataset.s);if(t){t.sub=e.value.trim().slice(0,40);savePr()}},
  pron(e){if(!guard()){render();return}const t=prFind(S.pr.list,e.dataset.s);if(t){t.on=e.checked;savePr();render()}},
  pgtitle(e){if(!guard())return;S.pg.title=e.value.trim().slice(0,100);savePg()},
  pgper(e){if(!guard())return;S.pg.per=Number(e.value)||2;savePg()},
  hallname(e){if(!guard())return;const x=prFind(S.pg.halls,e.dataset.s),n=e.value.trim();if(!x||!n){render();return}x.name=n.slice(0,40);savePg()},
  daydate(e){if(!guard())return;const d=prFind(S.pg.days,e.dataset.s);if(!d||!e.value){render();return}d.date=e.value;S.pg.days.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);savePg();render()},
  daynote(e){if(!guard())return;const d=prFind(S.pg.days,e.dataset.s);if(d){d.note=e.value.trim().slice(0,60);savePg()}},
  async prfile(e){
    const f=e.files&&e.files[0];if(!f)return;
    if(!window.XLSX){toast('تعذّر تحميل قارئ Excel. تحقق من الاتصال');return}
    try{
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',blankrows:false});
      let hr=-1,nc=0,sc=-1;
      for(let r=0;r<Math.min(rows.length,6)&&hr<0;r++){const c=(rows[r]||[]).map(norm);const i=c.findIndex(x=>/اسم|name/.test(x)&&x.length<30);if(i>=0){hr=r;nc=i;sc=c.findIndex((x,j)=>j!==i&&/اختصاص|تخصص|ماده|subject/.test(x))}}
      if(hr<0){const w=Math.max(0,...rows.map(r=>r.length));for(let j=0;j<w;j++)if(rows.filter(r=>/[^\d\s.]/.test(String(r[j]??''))).length>=rows.length/2){nc=j;break}}
      const items=rows.slice(hr+1).map(r=>({name:r[nc],sub:sc>=0?r[sc]:''})).filter(x=>/[^\d\s.]/.test(String(x.name??'')));
      const n=prAddNames(items);toast(n?`استُورد ${n} تدريسياً`:'لم أجد أسماء جديدة في الملف');render();
    }catch(err){console.error(err);toast('تعذّرت قراءة الملف. استخدم ملف xlsx أو csv');e.value=''}
  }
});

/* ---------- مراسلة أولياء الأمور ---------- */
const WA_ICON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 20.5l1.3-4.3A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 9c.4 3.2 2.8 5.6 6 6"/></svg>';
S.msg={scope:'class',only:'all',tpl:'free',text:null,sent:{}};
const MSG_TPL={
  free:['رسالة حرة','السلام عليكم ورحمة الله وبركاته\nولي أمر الطالب {الطالب} المحترم،\n\nاكتب نص الرسالة هنا.\n\nإدارة {المدرسة}'],
  absent:['تبليغ غياب','السلام عليكم ورحمة الله وبركاته\nولي أمر الطالب {الطالب} المحترم،\nنودّ إعلامكم أن الطالب غاب عن الدوام اليوم {اليوم} الموافق {التاريخ}.\nنرجو بيان سبب الغياب.\n\nإدارة {المدرسة}'],
  meet:['دعوة اجتماع','السلام عليكم ورحمة الله وبركاته\nولي أمر الطالب {الطالب} المحترم،\nندعوكم لحضور اجتماع أولياء الأمور يوم ........ الساعة ........ في بناية المدرسة.\nحضوركم يهمّنا.\n\nإدارة {المدرسة}'],
  exam:['تبليغ امتحانات','السلام عليكم ورحمة الله وبركاته\nولي أمر الطالب {الطالب} المحترم،\nنعلمكم أن امتحانات ........ تبدأ يوم ........\nنرجو متابعة الطالب في {الصف} وتهيئته للامتحانات.\n\nإدارة {المدرسة}'],
  general:['تبليغ عام','السلام عليكم ورحمة الله وبركاته\nأولياء أمور طلبتنا الكرام،\n\nاكتب نص التبليغ هنا.\n\nإدارة {المدرسة}']
};
const cleanPh=v=>String(v??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d+]/g,'').slice(0,20);
function waNum(ph){
  let d=cleanPh(ph).replace(/\D/g,'');const cc=String(S.cfg.cc||'964').replace(/\D/g,'')||'964';
  if(!d)return'';
  if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d=cc+d.slice(1);else if(d.length<=10)d=cc+d;
  return d.length>=10&&d.length<=15?d:'';
}
function msgFill(t,st){const now=new Date(),c=cls(st.c);
  return String(t||'').split('{الطالب}').join(st.name).split('{الصف}').join(c.name).split('{المدرسة}').join(S.cfg.name).split('{اليوم}').join(fWeekday.format(now)).split('{التاريخ}').join(now.getDate()+'/'+(now.getMonth()+1)+'/'+now.getFullYear())}
const waHref=st=>'https://wa.me/'+waNum(st.ph)+'?text='+encodeURIComponent(msgFill(S.msg.text,st));
async function msgTargets(){
  const M=S.msg,today=iso(new Date());
  let L=M.scope==='all'?S.cfg.classes.flatMap(c=>inClass(c.id)):inClass(S.classId);
  if(M.only==='absent'){
    const cids=[...new Set(L.map(s=>s.c))],docs={};
    await Promise.all(cids.map(async c=>{docs[c]=await loadDoc(attKey(c,today.slice(0,7)))}));
    L=L.filter(s=>{const day=docs[s.c].d[today];return day&&day[s.id]==='A'});
  }
  return L;
}
async function copyText(t,okMsg){
  try{await navigator.clipboard.writeText(t);toast(okMsg);return}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?okMsg:'تعذّر النسخ')}catch(e){toast('تعذّر النسخ')}
}
VIEWS.msg=async function(){
  if(!S.students.length)return noStudents();
  const M=S.msg;if(M.text==null)M.text=MSG_TPL[M.tpl][1];
  const L=await msgTargets(),ok=L.filter(s=>waNum(s.ph)),bad=L.length-ok.length,todo=ok.filter(s=>!M.sent[s.id]),nx=todo[0];
  const rows=L.map((s,i)=>{const good=!!waNum(s.ph),sent=M.sent[s.id];
    return`<div class="rowedit"><span class="muted">${i+1}</span><span style="flex:1;min-width:150px"><b>${esc(s.name)}</b>${M.scope==='all'?`<br><span class="muted">${esc(cls(s.c).name)}</span>`:''}</span>
    <input type="tel" class="ph" value="${esc(s.ph||'')}" placeholder="هاتف ولي الأمر" data-ch="stphone" data-s="${s.id}" aria-label="هاتف ولي أمر ${esc(s.name)}">
    ${good?`<a class="btn wa ${sent?'done':''}" data-wa="${s.id}" data-act="wasent" data-s="${s.id}" href="${esc(waHref(s))}" target="_blank" rel="noopener noreferrer">${WA_ICON}${sent?'أُرسلت، إعادة الإرسال':'مراسلة عبر واتساب'}</a>`:`<span class="tag no">${s.ph?'رقم غير صالح':'لا يوجد رقم'}</span>`}</div>`}).join('');
  return`<h2>مراسلة أولياء الأمور عبر واتساب</h2>
  <div class="bar">${seg('msgscope',M.scope,[['class','صف واحد'],['all','كل الصفوف']])}${M.scope==='class'?classPicker():''}${seg('msgonly',M.only,[['all','جميع الطلاب'],['absent','الغائبون اليوم فقط']])}</div>
  <h3 style="margin-top:8px">نص الرسالة</h3>
  <div class="bar">${seg('msgtpl',M.tpl,Object.entries(MSG_TPL).map(([k,v])=>[k,v[0]]))}</div>
  <textarea id="msgtext" aria-label="نص الرسالة">${esc(M.text)}</textarea>
  <p class="muted" style="margin:6px 0 0">هذه الرموز تُستبدل تلقائياً لكل طالب:<br><span dir="rtl">{الطالب} ، {الصف} ، {المدرسة} ، {اليوم} ، {التاريخ}</span></p>
  <h3>الإرسال إلى الجميع، واحداً بعد الآخر</h3>
  <div class="box pad">
    <p style="margin:0 0 10px">${L.length} طالباً في القائمة. ${ok.length} لهم رقم صالح، وأُرسل إلى ${ok.length-todo.length} منهم.${bad?`<br>${bad} بلا رقم صالح، أضف أرقامهم من القائمة في الأسفل.`:''}</p>
    <div class="bar" style="margin:0">${nx?`<a class="btn wa big" data-wa="${nx.id}" data-act="wasent" data-s="${nx.id}" href="${esc(waHref(nx))}" target="_blank" rel="noopener noreferrer">${WA_ICON}إرسال إلى التالي: ${esc(nx.name)}</a>`:(ok.length?'<span class="tag ok">اكتمل الإرسال إلى الجميع</span>':'<span class="tag no">لا توجد أرقام صالحة بعد</span>')}
      ${ok.length-todo.length?'<button class="btn" data-act="msgreset">البدء من جديد</button>':''}</div>
    <p class="muted" style="margin:10px 0 0">كل ضغطة تفتح واتساب والرسالة مكتوبة باسم الطالب، فتضغط «إرسال» ثم تعود للتالي.</p>
  </div>
  <h3>رسالة واحدة للجميع عبر قائمة بث</h3>
  <div class="box pad"><p style="margin:0 0 10px">انسخ النص والأرقام، ثم أنشئ «قائمة بث» في واتساب والصق الرسالة مرة واحدة.<br>قائمة البث تصل فقط لمن حفظ رقم المدرسة في هاتفه.</p>
    <div class="bar" style="margin:0"><button class="btn" data-act="msgcopy">نسخ نص الرسالة</button><button class="btn" data-act="msgnums">نسخ الأرقام (${ok.length})</button>
    <label class="f">مفتاح الدولة<input type="tel" class="ph" style="width:90px" value="${esc(S.cfg.cc||'964')}" data-ch="msgcc" aria-label="مفتاح الدولة"></label></div></div>
  <h3>أولياء الأمور</h3>
  ${L.length?`<div class="box">${rows}</div>`:`<p class="muted">${M.only==='absent'?'لا يوجد غائبون مسجَّلون اليوم في هذا الاختيار.':'لا يوجد طلاب في هذا الصف.'}</p>`}`;
};
Object.assign(ACT,{
  msgscope(b){S.msg.scope=b.dataset.v;render()},
  msgonly(b){S.msg.only=b.dataset.v;if(b.dataset.v==='absent'&&S.msg.tpl==='free'){S.msg.tpl='absent';S.msg.text=MSG_TPL.absent[1]}render()},
  msgtpl(b){S.msg.tpl=b.dataset.v;S.msg.text=MSG_TPL[b.dataset.v][1];render()},
  wasent(b){S.msg.sent[b.dataset.s]=1;setTimeout(()=>{if(S.tab==='msg')render()},600)},
  msgreset(){S.msg.sent={};render()},
  msgcopy(){copyText(S.msg.text.split('ولي أمر الطالب {الطالب} المحترم').join('أولياء أمور طلبتنا الكرام').split('{الطالب}').join('').split('{الصف}').join('').split('{المدرسة}').join(S.cfg.name).split('{اليوم}').join(fWeekday.format(new Date())).split('{التاريخ}').join(new Date().getDate()+'/'+(new Date().getMonth()+1)+'/'+new Date().getFullYear()),'نُسخ نص الرسالة')},
  async msgnums(){const L=(await msgTargets()).map(s=>waNum(s.ph)).filter(Boolean);if(!L.length){toast('لا توجد أرقام صالحة');return}copyText([...new Set(L)].map(n=>'+'+n).join('\n'),`نُسخ ${new Set(L).size} رقماً`)}
});
Object.assign(CH,{
  stphone(e){if(!guard())return;const s=S.students.find(x=>x.id===e.dataset.s);if(!s)return;s.ph=cleanPh(e.value);e.value=s.ph;saveStudents();
    if(s.ph&&!waNum(s.ph))toast('الرقم غير صالح. اكتبه مثل 07701234567');if(S.tab==='msg')render()},
  msgcc(e){if(!guard())return;S.cfg.cc=e.value.replace(/\D/g,'').slice(0,4)||'964';saveCfg();render()}
});
document.addEventListener('input',ev=>{
  if(ev.target.id!=='msgtext')return;S.msg.text=ev.target.value;
  document.querySelectorAll('a[data-wa]').forEach(a=>{const s=S.students.find(x=>x.id===a.dataset.wa);if(s)a.href=waHref(s)});
});

/* ---------- البدء ---------- */
render();
(async()=>{
  await Store.init();
  try{await loadBase()}catch(e){console.error(e)}
  S.mode=hasLock()?'locked':'ready';setSync();render();
})();
</script>
</body>
</html>
